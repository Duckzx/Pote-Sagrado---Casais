name: Configurar login por e-mail

on:
  push:
    branches: [main]
    paths:
      - scripts/enable-email-auth.mjs
      - .github/workflows/firebase-email-auth.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-email-auth
  cancel-in-progress: false

jobs:
  enable-email-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FIREBASE_PROJECT_ID: potesagrado-34c79
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Configurar credenciais
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::Falta o segredo FIREBASE_SERVICE_ACCOUNT (veja o README)."
            exit 1
          fi
          umask 077
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-auth-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-auth-sa.json" >> "$GITHUB_ENV"
      - name: Ativar e verificar login por e-mail
        run: npm run firebase:enable-email-auth
      - name: Remover credenciais temporárias
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-auth-sa.json"
